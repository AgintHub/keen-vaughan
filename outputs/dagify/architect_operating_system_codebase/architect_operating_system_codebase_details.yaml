dag_type: plain_text
description: Architect an operating system codebase by representing each module/function
  as a modular component, ensuring each node directly corresponds to a discrete system
  functionality, maintaining strict dependencies, concurrency, and acyclicity in the
  execution flow.
name: architect_operating_system_codebase
nodes:
  design_hardware_abstraction_layer_cpu:
    agent: false
    description: Implement CPU-specific hardware abstraction for real-time systems.
    name: design_hardware_abstraction_layer_cpu
    nodes_depended_on:
    - specify_system_requirements
    nodes_dependent_on:
    - interrupt_controller_module
    prompt: Design a low-latency hardware abstraction module for CPU interactions,
      including clock access, multi-core management, and real-time task scheduling
      interfaces.
  device_driver_io:
    agent: false
    description: Implement I/O device drivers with latency-optimized APIs.
    name: device_driver_io
    nodes_depended_on:
    - design_hardware_abstraction_layer_cpu
    nodes_dependent_on:
    - interrupt_logger
    prompt: Create I/O device drivers with asynchronous I/O interfaces and deadline-driven
      priority scheduling.
  file_system_cache:
    agent: false
    description: Create memory-mapped file caching with pre-fetching capabilities.
    name: file_system_cache
    nodes_depended_on:
    - network_stack
    nodes_dependent_on: []
    prompt: Design a memory-mapped file cache with sliding window prefetcher and remote
      API latency-aware caching.
  instrumentation_api:
    agent: false
    description: Create monitoring API for system metrics collection.
    name: instrumentation_api
    nodes_depended_on:
    - memory_paging_manager
    - network_stack
    nodes_dependent_on: []
    prompt: Implement a standardized API for real-time memory usage, page fault latency,
      and network jitter monitoring.
  interrupt_controller_module:
    agent: false
    description: Create a hierarchical interrupt controller for nested hardware events.
    name: interrupt_controller_module
    nodes_depended_on:
    - design_hardware_abstraction_layer_cpu
    nodes_dependent_on:
    - memory_paging_manager
    prompt: Implement a multi-level interrupt controller with masking, prioritization,
      and logging for nested hardware interrupts in real-time systems.
  interrupt_logger:
    agent: false
    description: Implement logging system for interrupt event tracing.
    name: interrupt_logger
    nodes_depended_on:
    - device_driver_io
    nodes_dependent_on: []
    prompt: Design a real-time logging module for interrupt handling timestamps and
      error tracing.
  memory_paging_manager:
    agent: false
    description: Design virtual memory paging with demand paging and TLB optimization.
    name: memory_paging_manager
    nodes_depended_on:
    - interrupt_controller_module
    nodes_dependent_on:
    - slab_allocator
    prompt: Implement demand-paged virtual memory with 2MiB/1GiB page support, TLB
      optimization, and memory-mapped IO caching.
  network_stack:
    agent: false
    description: Build latency-tolerant network stack for robotic systems.
    name: network_stack
    nodes_depended_on:
    - process_scheduler_rate_monotonic
    nodes_dependent_on:
    - file_system_cache
    prompt: Implement a hybrid polled/interrupt-driven network stack with adaptive
      congestion control for laggy remote APIs.
  process_scheduler_rate_monotonic:
    agent: false
    description: Implement rate-monotonic process scheduling algorithm.
    name: process_scheduler_rate_monotonic
    nodes_depended_on:
    - slab_allocator
    nodes_dependent_on:
    - network_stack
    prompt: Create a rate-monotonic scheduling implementation for real-time task prioritization.
  slab_allocator:
    agent: false
    description: Build per-core slab allocator for lock-free memory management.
    name: slab_allocator
    nodes_depended_on:
    - memory_paging_manager
    nodes_dependent_on:
    - process_scheduler
    prompt: Develop a slab allocator with per-core caches, lock-free free lists, and
      multi-level buddy system for memory fragmentation reduction.
  specify_system_requirements:
    agent: false
    description: Define system-specific parameters for low-latency robotics OS.
    name: specify_system_requirements
    nodes_depended_on: []
    nodes_dependent_on:
    - design_hardware_abstraction_layer
    prompt: Specify the system requirements for a low-latency, real-time robotics
      system that interacts with laggy remote APIs. Define CPU architecture, memory
      thresholds, storage, network protocols, and OS optimization strategies.
