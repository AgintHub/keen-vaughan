dag_type: plain_text
description: Generated workflow from UI.
name: build_operating_system
nodes:
  create_memory_manager:
    agent: false
    description: Design a high‑performance memory manager that allocates and deallocates
      memory, handles page faults, and implements a virtual memory subsystem optimized
      for low‑latency real‑time robotics systems interacting with laggy remote APIs.
    name: create_memory_manager
    nodes_depended_on:
    - design_hardware_abstraction_layer
    - develop_file_system
    nodes_dependent_on: []
    prompt: 'Design a high‑performance, low‑latency memory manager for a robotics
      operating system that must operate in real‑time while interacting with potentially
      laggy remote APIs.


      - **Allocation & Deallocation**: Implement a slab allocator with per‑core caches,
      lock‑free free lists, and a multi‑level buddy system to reduce fragmentation
      and latency spikes.

      - **Page Fault Handling**: Build a non‑blocking, event‑driven page fault handler
      that uses asynchronous I/O to fetch pages from storage or remote services, with
      priority‑based scheduling to keep critical robotic tasks responsive.

      - **Virtual Memory**: Provide demand‑paged virtual memory with support for large
      pages (2 MiB/1 GiB) and transparent huge pages to lower translation look‑aside
      buffer (TLB) misses. Include support for memory‑mapped network buffers that
      can be swapped to a local cache when remote latency exceeds a configurable threshold.

      - **Real‑Time Guarantees**: Integrate a deterministic memory reclamation policy
      (e.g., a bounded‑time reclamation thread) and expose real‑time memory usage
      metrics to the scheduler. Ensure that page faults do not cause priority inversion.

      - **Remote API Interaction**: Design a fault‑tolerant pre‑fetcher that anticipates
      remote data needs, maintains a sliding window of cached responses, and falls
      back to graceful degradation when network stalls.

      - **Security & Isolation**: Enforce per‑process address spaces with protection
      rings, support for secure enclaves, and sandboxed I/O buffers.

      - **Instrumentation**: Expose APIs for monitoring allocation rates, page fault
      latency, TLB miss rates, and memory pressure, facilitating dynamic tuning in
      a robotic control loop.


      The implementation should be modular, allowing the hardware abstraction layer
      to provide architecture‑specific support for cache lines, TLB entries, and page
      table formats, while the file system node supplies a reliable backing store
      for swapped pages.'
  define_system_requirements:
    agent: false
    description: Defines the low-latency, real-time system requirements for robotics
      applications that interact with laggy remote APIs, including CPU architecture,
      memory size, storage capacity, network interfaces, and operating system optimizations.
      The system must ensure reliable and efficient communication with external services,
      handle high-priority interrupts, and maintain predictable timing behavior. Additionally,
      the system should support robust error handling, secure data transmission, and
      provide a scalable architecture for future expansion.
    name: define_system_requirements
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Specify the system requirements for a low-latency, real-time robotics
      system that interacts with laggy remote APIs. The system should utilize a CPU
      architecture with a high clock speed, multiple cores, and hardware accelerators
      for tasks such as computer vision and machine learning. The memory size should
      be sufficient to handle large datasets and complex algorithms, with a minimum
      of 16 GB of RAM and 512 GB of storage capacity. The network interfaces should
      support high-speed communication protocols such as Ethernet, Wi-Fi, and UART,
      with built-in support for socket programming and real-time data streaming. The
      operating system should be optimized for low-latency and real-time performance,
      with a customized Linux kernel, real-time scheduling, and interrupt handling.
      Provide a detailed specification of the system requirements, including the operating
      system version, device drivers, and software dependencies. Ensure that the system
      can handle varying levels of network latency, packet loss, and jitter, and provide
      a framework for monitoring and debugging system performance in real-time.
  design_hardware_abstraction_layer:
    agent: false
    description: Creates a hardware abstraction layer that enables efficient, low-latency
      interaction with various hardware components, including CPUs, memory, storage
      devices, and I/O devices, while accommodating the needs of real-time robotics
      systems and mitigating the effects of laggy remote APIs. This layer provides
      a standardized interface for accessing and controlling hardware resources, ensuring
      seamless communication between the operating system and the hardware, and facilitating
      the development of high-performance, responsive applications.
    name: design_hardware_abstraction_layer
    nodes_depended_on:
    - define_system_requirements
    nodes_dependent_on: []
    prompt: Design a hardware abstraction layer that interacts with various hardware
      components, such as CPUs, memory, storage devices, and I/O devices, with a focus
      on low-latency, real-time robotics systems that also interact with laggy remote
      APIs. The layer should provide a standardized interface for accessing and controlling
      hardware resources, ensuring seamless communication between the operating system
      and the hardware. Consider implementing a hybrid interrupt-driven and polling-based
      approach to achieve optimal performance and responsiveness. Additionally, incorporate
      mechanisms for handling API latency, such as asynchronous I/O, caching, and
      predictive fetching, to minimize the impact of laggy remote APIs on the system's
      overall performance. Ensure the hardware abstraction layer is modular, scalable,
      and adaptable to accommodate diverse hardware configurations and evolving system
      requirements.
  develop_file_system:
    agent: false
    description: Develops a customized file system for low-latency real-time robotics
      systems, incorporating a modular architecture, hierarchical file system structure,
      and optimized file operations, while ensuring seamless integration with laggy
      remote APIs and hardware abstraction layer.
    name: develop_file_system
    nodes_depended_on:
    - design_hardware_abstraction_layer
    nodes_dependent_on: []
    prompt: Design and implement a customizable, real-time file system that seamlessly
      integrates with low-latency robotics systems and laggy remote APIs. The file
      system should incorporate a modular architecture, allowing for efficient management
      of files, directories, and storage devices. Implement a hierarchical file system
      structure with support for concurrent access, ensuring data consistency and
      integrity. Develop a suite of file operations, including create, read, write,
      and delete, with optimized performance for real-time systems. Integrate memory
      management techniques, such as paging and caching, to minimize latency and maximize
      throughput. Incorporate synchronization mechanisms, like semaphores and mutexes,
      to prevent data corruption and ensure thread safety. Utilize a hardware abstraction
      layer to interact with various storage devices, including SSDs, HDDs, and flash
      memory. Implement a caching mechanism to mitigate the effects of laggy remote
      APIs, ensuring seamless communication between the file system and external services.
      Conduct thorough testing and validation to guarantee the file system's reliability,
      scalability, and performance in real-time robotics applications.
  handle_interrupts:
    agent: false
    description: Develop a sophisticated interrupt handling mechanism that enables
      efficient and reliable management of interrupts in a low-latency realtime robotics
      system. The mechanism should be designed to handle interrupts from various hardware
      components, prioritize them based on their urgency and scheduling requirements,
      and ensure seamless interaction with external systems, including laggy remote
      APIs. The interrupt handler should be integrated with the process scheduler
      and memory manager to enable efficient task scheduling, context switching, and
      interrupt-driven I/O operations, and should include features such as interrupt
      prioritization, masking, and logging to ensure predictable system behavior and
      debuggability.
    name: handle_interrupts
    nodes_depended_on:
    - design_hardware_abstraction_layer
    - create_memory_manager
    - implement_process_scheduler
    nodes_dependent_on: []
    prompt: Design a high-performance, low-latency interrupt handler that efficiently
      manages interrupts generated by hardware components such as timers, keyboards,
      and network interfaces in a realtime robotics system. The handler should prioritize
      interrupts based on their urgency and scheduling requirements, ensuring seamless
      interaction with laggy remote APIs. Implement a hybrid interrupt handling approach,
      combining polling and interrupt-driven techniques to minimize overhead and optimize
      system responsiveness. Utilize a hierarchical interrupt controller to handle
      nested interrupts, and incorporate interrupt prioritization and masking mechanisms
      to prevent interrupt storms and ensure predictable system behavior. Integrate
      the interrupt handler with the process scheduler to enable efficient task scheduling
      and context switching, and implement interrupt-driven I/O operations to reduce
      latency and improve system throughput. Ensure the interrupt handler is designed
      with debuggability and fault tolerance in mind, providing features such as interrupt
      logging, error handling, and system recovery mechanisms.
  implement_process_scheduler:
    agent: false
    description: Designs and implements a high-performance, low-latency process scheduler
      tailored for real-time robotics systems, incorporating priority queueing, earliest
      deadline first scheduling, and rate monotonic scheduling to optimize task execution.
      The scheduler also accommodates interactions with laggy remote APIs through
      asynchronous communication protocols, ensuring seamless integration and minimizing
      delays. Furthermore, it incorporates advanced features such as process synchronization,
      inter-process communication, and deadlock prevention to guarantee reliable and
      efficient operation.
    name: implement_process_scheduler
    nodes_depended_on:
    - design_hardware_abstraction_layer
    - create_memory_manager
    nodes_dependent_on: []
    prompt: Implement a process scheduler that manages multiple processes for low-latency
      real-time robotics systems, including process creation, scheduling, and termination.
      The scheduler should incorporate priority queueing, earliest deadline first
      scheduling, and rate monotonic scheduling to optimize task execution. Ensure
      seamless integration with laggy remote APIs through asynchronous communication
      protocols, and implement advanced features such as process synchronization,
      inter-process communication, and deadlock prevention. Utilize techniques like
      mutexes, semaphores, and monitors to prevent deadlocks and race conditions.
      Develop a robust and reliable scheduler that can handle a wide range of tasks,
      prioritize them based on their urgency and importance, and allocate system resources
      efficiently to meet the stringent requirements of real-time robotics systems.
  integrate_subsystems:
    agent: false
    description: Integrate the various subsystems, including file system, memory manager,
      process scheduler, interrupt handler, and device drivers, into a cohesive, low-latency,
      real-time operating system optimized for robotics applications that interact
      with laggy remote APIs, ensuring seamless communication, minimal jitter, and
      high reliability. The integrated system should provide efficient resource allocation,
      prioritize tasks, and handle exceptions, while maintaining a responsive and
      adaptable system that can cope with variable network conditions and API response
      times.
    name: integrate_subsystems
    nodes_depended_on:
    - develop_file_system
    - create_memory_manager
    - implement_process_scheduler
    - handle_interrupts
    - write_device_drivers
    nodes_dependent_on: []
    prompt: Integrate the file system, memory manager, process scheduler, interrupt
      handler, and device drivers into a unified operating system that meets the stringent
      requirements of low-latency real-time robotics systems. Ensure that the system
      prioritize tasks based on their urgency and deadline, handle interrupts and
      exceptions efficiently, and maintain a stable and responsive system even in
      the presence of laggy remote APIs. Implement a hybrid scheduling approach that
      combines the benefits of rate monotonic scheduling (RMS) and earliest deadline
      first (EDF) scheduling to minimize latency and ensure predictable behavior.
      Utilize a combination of techniques such as priority inheritance, priority ceiling
      protocol, and stack resource policy to prevent priority inversion and ensure
      efficient resource allocation. Implement a real-time capable network stack that
      can handle variable network conditions and API response times, and provide a
      set of APIs for robotics applications to interact with the operating system
      and access its services.
  test_operating_system:
    agent: false
    description: Conduct a rigorous, automated evaluation of the operating system
      for bugs, performance degradation, and security weaknesses, with a special emphasis
      on low‑latency real‑time behavior for robotics and robustness against laggy
      remote APIs. Automatically detect and remediate issues, producing structured
      diagnostic reports and applying corrective patches.
    name: test_operating_system
    nodes_depended_on:
    - integrate_subsystems
    nodes_dependent_on: []
    prompt: Perform a comprehensive, automated assessment of the newly integrated
      operating system, focusing on low‑latency real‑time performance suitable for
      robotics applications. Use a suite of testing frameworks (e.g., Google Test
      for C++, Catch2, and Boost.Test) combined with real‑time monitoring tools (e.g.,
      RTAI trace, CyclicTest) to detect kernel stalls, priority inversion, and scheduling
      jitter. Execute security scans with tools such as OpenSCAP, Lynis, and custom
      static analysis scripts to uncover privilege escalation vectors, insecure IPC
      mechanisms, and outdated firmware. Validate network stack resilience against
      high‑latency, intermittent remote APIs by simulating bandwidth throttling, packet
      loss, and delayed responses, then verify the OS’s ability to maintain deterministic
      control loops (≤ 1 ms update interval) using latency‑sensitive task scheduling
      and RT‑Preempt patches. Log all findings with structured JSON reports, and automatically
      apply hot‑patches or configuration tweaks (e.g., tuning `vm.swappiness`, `sched_latency_ns`,
      `net.ipv4.tcp_rmem`) to resolve identified bottlenecks. Ensure that any fixes
      preserve system integrity and do not regress real‑time guarantees.
  write_device_drivers:
    agent: false
    description: Implement device drivers that interact with various hardware devices
      in a low-latency real-time robotics system, handling device-specific interrupts,
      and providing a reliable interface for the operating system. The device drivers
      should be designed to work seamlessly with the hardware abstraction layer, memory
      manager, and process scheduler to minimize latency and ensure reliable operation.
    name: write_device_drivers
    nodes_depended_on:
    - design_hardware_abstraction_layer
    - create_memory_manager
    - implement_process_scheduler
    - handle_interrupts
    nodes_dependent_on: []
    prompt: Design and implement device drivers that interact with various hardware
      devices, such as disk controllers, network adapters, and printers, in a low-latency
      real-time robotics system. The drivers should be optimized for minimizing latency,
      jitter, and packet loss, while also handling device-specific interrupts and
      providing a reliable interface for the operating system. To achieve this, implement
      a hybrid interrupt handling mechanism that utilizes both hardware and software
      interrupts, and leverage the memory manager's ability to allocate and deallocate
      memory efficiently. Additionally, integrate the device drivers with the process
      scheduler to ensure seamless priority scheduling and synchronization. Furthermore,
      consider the impact of laggy remote APIs on the system's performance and implement
      strategies to mitigate their effects, such as caching, buffering, or asynchronous
      communication. Provide a detailed description of the device drivers' architecture,
      including their interactions with the hardware abstraction layer, memory manager,
      and process scheduler.
